name: Deploy to GitHub Pages

# Runs on every push to main (and can be started by hand from the Actions tab).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Asks GitHub Pages where the site is served from: "/<repo>" for
      # https://<user>.github.io/<repo>/, or "" for a custom domain.
      - name: Read GitHub Pages settings
        id: pages
        uses: actions/configure-pages@v5

      - name: Build the static site
        run: bun run build
        env:
          STATIC_EXPORT: "1"
          # Worked out automatically from the Pages settings above, so it is
          # right with or without a custom domain. No repository variable needed.
          BASE_PATH: ${{ format('{0}/', steps.pages.outputs.base_path) }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
